<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSA — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        color: #fff;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
      button {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">OSA</div>
      <h1>You are currently offline</h1>
      <p>OSA requires an active internet connection to sync real-time messages and calls. Please check your connection and try again.</p>
      <button onclick="window.location.reload()">Reconnect to OSA</button>
    </div>
  </body>
</html>
