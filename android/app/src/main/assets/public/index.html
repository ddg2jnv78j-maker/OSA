    <div id="root"></div>
    <script>
      (function () {
        function showFallback(msg) {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#f8fafc;padding:24px;font-family:system-ui,-apple-system,sans-serif;">' +

            '<div style="width:52px;height:52px;border-radius:16px;background:#2563eb;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">OSA</div>' +
            '<h2 style="margin:0 0 8px;font-size:18px;font-weight:700;">OSA Startup Recovery</h2>' +
            '<p style="margin:0 0 18px;font-size:12px;color:#94a3b8;line-height:1.5;">' +
            (msg || 'Refreshing application assets...') +
            '</p>' +
            '<button onclick="(async function(){try{if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();for(var i=0;i<r.length;i++)await r[i].unregister();}if(window.caches){var k=await caches.keys();for(var j=0;j<k.length;j++)await caches.delete(k[j]);}}catch(e){}location.reload(true);})()" style="width:100%;padding:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:600;font-size:13px;cursor:pointer;">Clear Cache &amp; Reload OSA</button>' +
            '</div></div>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            showFallback('A cached resource was updated. Tap below to reload the latest version of OSA.');
          } else if (e && e.message) {
            showFallback(e.message);
          }
        }, true);
      })();
    </script>
