  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        try {
          if (
            (location.hostname === 'osa-chat.com' || location.hostname === 'www.osa-chat.com') &&
            (location.pathname === '/OSA' || location.pathname.startsWith('/OSA/'))
          ) {
            var cleanSubpath = location.pathname.replace(/^\/OSA\/?/, '/');
            history.replaceState(null, '', cleanSubpath + (location.search || '') + (location.hash || ''));
          }
        } catch (err) {}

        async function purgeCachesAndReload(forceBust) {
          try {
            if (navigator.serviceWorker) {
              var r = await navigator.serviceWorker.getRegistrations();
              for (var i = 0; i < r.length; i++) await r[i].unregister();
            }
            if (window.caches) {
              var k = await caches.keys();
              for (var j = 0; j < k.length; j++) await caches.delete(k[j]);
            }
          } catch (e) {}
          if (forceBust) {
            var u = new URL(location.href);
            u.searchParams.set('_osa_v', String(Date.now()));
            location.replace(u.toString());
          } else {
            location.reload();
          }
        }

        window.__osaPurgeAndReload = purgeCachesAndReload;

        function showFallback(msg) {
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#f8fafc;padding:24px;font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="max-width:400px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:24px;padding:24px;text-align:center;">' +
            '<div style="width:52px;height:52px;border-radius:16px;background:#2563eb;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">OSA</div>' +
            '<h2 style="margin:0 0 8px;font-size:18px;font-weight:700;">OSA Startup Recovery</h2>' +
            '<p style="margin:0 0 18px;font-size:12px;color:#94a3b8;line-height:1.5;">' +
            (msg || 'Refreshing application assets...') +
            '</p>' +
            '<button onclick="window.__osaPurgeAndReload(true)" style="width:100%;padding:12px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:600;font-size:13px;cursor:pointer;">Clear Cache &amp; Reload OSA</button>' +
            '</div></div>';
        }

        window.addEventListener('error', function (e) {
          if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
            var url = e.target.src || e.target.href || '';
            if (!url || url.indexOf('fonts.googleapis.com') !== -1 || url.indexOf('fonts.gstatic.com') !== -1) {
              return;
            }
            if (url.indexOf('/assets/') !== -1 || url.indexOf('/src/main') !== -1) {
              try {
                var alreadyRetried = sessionStorage.getItem('osa_asset_auto_retry_v2');
                if (!alreadyRetried) {
                  sessionStorage.setItem('osa_asset_auto_retry_v2', '1');
                  purgeCachesAndReload(true);
                  return;
                }
              } catch (err) {}
              showFallback('A cached resource was updated. Tap below to reload the latest version of OSA.');
            }
          }
        }, true);
      })();
    </script>
  </body>
