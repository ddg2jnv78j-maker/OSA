plugins {
    id 'com.android.application'
}

android {
    namespace 'app.osa.messaging'
    compileSdk 34

    defaultConfig {
        applicationId "app.osa.messaging"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    android.defaultConfig {
        resValue "string", "gcm_defaultSenderId", "935163585205"
        resValue "string", "google_api_key", "AIzaSyBu8csOUFolQZxPTutfMpiAamn-SbGzwEE"
        resValue "string", "google_app_id", "1:935163585205:android:a020745ef68deff41854fc"
        resValue "string", "google_crash_reporting_api_key", "AIzaSyBu8csOUFolQZxPTutfMpiAamn-SbGzwEE"
        resValue "string", "google_storage_bucket", "osa-app-88c1e.firebasestorage.app"
        resValue "string", "project_id", "osa-app-88c1e"
    }
}
